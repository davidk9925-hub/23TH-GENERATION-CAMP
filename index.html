<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>제23차 차세대리더십캠프 참가신청서</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#f0f4f9',
              100: '#d9e2ec',
              500: '#334e68',
              800: '#102a43',
              900: '#0b1b2b',
            },
            amberGold: '#f59e0b',
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">

  <!-- Header Section -->
  <header class="bg-gradient-to-r from-navy-900 via-navy-800 to-slate-900 text-white pt-8 pb-10 px-4 rounded-b-3xl shadow-lg relative overflow-hidden">
    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="max-w-md mx-auto text-center relative z-10">
      <div class="inline-block px-3 py-1 bg-amber-500/20 text-amber-300 text-xs font-semibold rounded-full mb-2 tracking-wide uppercase">
        Registration Open
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-1 text-white">
        제23차 차세대리더십캠프
      </h1>
      <p class="text-amber-400 font-bold text-xl mb-3 tracking-wide">
        "오라! COME!"
      </p>
      <div class="bg-white/10 backdrop-blur-md rounded-lg py-2 px-4 inline-block text-xs sm:text-sm text-slate-200 border border-white/10">
        <i class="fa-solid fa-quote-left text-amber-400 mr-1"></i>
        그리고 와서 나를 따르라 하시니 <span class="text-amber-300 font-semibold">[막10:21]</span>
        <i class="fa-solid fa-quote-right text-amber-400 ml-1"></i>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 -mt-6 relative z-20 space-y-5">

    <!-- Camp Information Card -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
      <h2 class="text-base font-bold text-navy-800 mb-3 flex items-center border-b border-slate-100 pb-2">
        <i class="fa-solid fa-circle-info text-amber-500 mr-2"></i> 캠프 개요 안내
      </h2>
      <div class="space-y-3 text-sm">
        <div class="flex items-start">
          <div class="w-20 text-slate-400 font-medium shrink-0 flex items-center">
            <i class="fa-regular fa-calendar mr-1.5 text-slate-400"></i> 일시
          </div>
          <div class="text-slate-800 font-semibold">1월 11일(월) ~ 1월 13일(수)</div>
        </div>
        <div class="flex items-start">
          <div class="w-20 text-slate-400 font-medium shrink-0 flex items-center">
            <i class="fa-solid fa-location-dot mr-1.5 text-slate-400"></i> 장소
          </div>
          <div class="text-slate-800 font-semibold">동신 기도원</div>
        </div>
        <div class="flex items-start">
          <div class="w-20 text-slate-400 font-medium shrink-0 flex items-center">
            <i class="fa-solid fa-map-pin mr-1.5 text-slate-400"></i> 주소
          </div>
          <div class="text-slate-700 flex-1">
            경기도 양주시 은현면 화합로 1094번길 232
            <button type="button" onclick="copyAddress()" class="ml-1 text-xs text-navy-500 underline font-medium active:text-navy-800">
              [주소복사]
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between bg-amber-50 rounded-xl p-3 border border-amber-100 mt-2">
          <div class="flex items-center text-amber-900 font-medium text-xs sm:text-sm">
            <i class="fa-solid fa-users text-amber-500 mr-2"></i> 모집 인원
          </div>
          <div class="text-amber-900 font-bold text-xs sm:text-sm">
            선착순 <span class="text-amber-600 text-base">80명</span>
          </div>
        </div>
        <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3 border border-slate-200/60">
          <div class="flex items-center text-slate-600 font-medium text-xs sm:text-sm">
            <i class="fa-solid fa-receipt text-slate-400 mr-2"></i> 참가비
          </div>
          <div class="text-slate-500 font-medium text-xs sm:text-sm">
            추후 공지 (대기)
          </div>
        </div>
      </div>
    </section>

    <!-- Registration Form -->
    <form id="campRegistrationForm" onsubmit="handleFormSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-5">
      <h2 class="text-base font-bold text-navy-800 border-b border-slate-100 pb-2 flex items-center justify-between">
        <span class="flex items-center">
          <i class="fa-solid fa-pen-to-square text-amber-500 mr-2"></i> 참가자 정보 입력
        </span>
        <span class="text-xs text-red-500 font-normal">* 필수 입력</span>
      </h2>

      <!-- 1. Name -->
      <div>
        <label for="name" class="block text-xs font-semibold text-slate-700 mb-1">
          참가자 이름 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="name" required placeholder="홍길동"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
      </div>

      <!-- 2. Birth Date -->
      <div>
        <label for="birth" class="block text-xs font-semibold text-slate-700 mb-1">
          생년월일 <span class="text-red-500">*</span>
          <span class="text-slate-400 text-[11px] font-normal ml-1">(연도별 정렬 가능 서식)</span>
        </label>
        <input type="date" id="birth" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
      </div>

      <!-- 3. Gender -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">
          성별 <span class="text-red-500">*</span>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center p-2.5 border border-slate-200 rounded-xl bg-slate-50 cursor-pointer hover:bg-slate-100 has-[:checked]:bg-navy-800 has-[:checked]:text-white has-[:checked]:border-navy-800 transition-all text-sm font-medium">
            <input type="radio" name="gender" value="남성" required class="sr-only">
            <span>남성</span>
          </label>
          <label class="flex items-center justify-center p-2.5 border border-slate-200 rounded-xl bg-slate-50 cursor-pointer hover:bg-slate-100 has-[:checked]:bg-navy-800 has-[:checked]:text-white has-[:checked]:border-navy-800 transition-all text-sm font-medium">
            <input type="radio" name="gender" value="여성" required class="sr-only">
            <span>여성</span>
          </label>
        </div>
      </div>

      <!-- 4. Phone -->
      <div>
        <label for="phone" class="block text-xs font-semibold text-slate-700 mb-1">
          휴대전화번호 <span class="text-red-500">*</span>
        </label>
        <input type="tel" id="phone" required placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneNumber(this)"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
      </div>

      <!-- 5. Church -->
      <div>
        <label for="church" class="block text-xs font-semibold text-slate-700 mb-1">
          소속 교회 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="church" required placeholder="예: 동신교회"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
      </div>

      <!-- 6. Denominations -->
      <div>
        <label for="denominations" class="block text-xs font-semibold text-slate-700 mb-1">
          교단 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="denominations" required placeholder="예: 기성, 예장통합, 기감 등"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
      </div>

      <!-- 7. Position -->
      <div>
        <label for="position" class="block text-xs font-semibold text-slate-700 mb-1">
          직분 <span class="text-red-500">*</span>
        </label>
        <select id="position" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-500 focus:bg-white transition-all">
          <option value="" disabled selected>선택해 주세요</option>
          <option value="청년/학생">청년 / 학생</option>
          <option value="교사">교사</option>
          <option value="집사">집사</option>
          <option value="권사">권사</option>
          <option value="장로">장로</option>
          <option value="전도사">전도사</option>
          <option value="목사">목사</option>
          <option value="기타">기타</option>
        </select>
      </div>

      <hr class="border-slate-100">

      <!-- Terms & Agreements -->
      <div class="space-y-3 pt-1">
        <label class="block text-xs font-semibold text-slate-700">
          약관 동의 <span class="text-red-500">*</span>
        </label>
        
        <div class="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
          <input type="checkbox" id="checkAll" onchange="toggleAllTerms(this)" class="w-4 h-4 text-navy-800 rounded focus:ring-navy-500 border-slate-300">
          <label for="checkAll" class="ml-2.5 text-xs font-bold text-slate-800 cursor-pointer">
            약관 전체 동의하기
          </label>
        </div>

        <div class="space-y-2 text-xs text-slate-600 pl-1">
          <div class="flex items-start">
            <input type="checkbox" id="term1" required class="term-check w-3.5 h-3.5 mt-0.5 text-navy-800 rounded border-slate-300 focus:ring-navy-500">
            <label for="term1" class="ml-2 cursor-pointer leading-tight">
              [필수] 등록 및 회비 정보 관련 사항 동의
            </label>
          </div>
          <div class="flex items-start">
            <input type="checkbox" id="term2" required class="term-check w-3.5 h-3.5 mt-0.5 text-navy-800 rounded border-slate-300 focus:ring-navy-500">
            <label for="term2" class="ml-2 cursor-pointer leading-tight">
              [필수] 캠프 환불규정 동의
            </label>
          </div>
          <div class="flex items-start">
            <input type="checkbox" id="term3" required class="term-check w-3.5 h-3.5 mt-0.5 text-navy-800 rounded border-slate-300 focus:ring-navy-500">
            <label for="term3" class="ml-2 cursor-pointer leading-tight">
              [필수] 개인정보 수집 및 활용 동의
            </label>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
        class="w-full py-3.5 px-4 bg-navy-800 hover:bg-navy-900 active:scale-[0.99] text-white font-bold text-base rounded-xl shadow-lg shadow-navy-800/30 transition-all duration-150 flex items-center justify-center space-x-2">
        <span id="btnText">캠프 참가 신청하기</span>
        <i id="btnSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
      </button>
    </form>
  </main>

  <!-- Complete Modal -->
  <div id="completeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div id="modalContainer" class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl scale-95 transition-transform duration-200">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="text-lg font-bold text-center text-slate-800 mb-1">신청이 완료되었습니다!</h3>
      <p class="text-xs text-center text-slate-500 mb-4">제23차 차세대리더십캠프에 정상 접수되었습니다.</p>
      
      <div id="summaryContent" class="bg-slate-50 rounded-xl p-3.5 text-xs text-slate-700 space-y-1.5 mb-5 border border-slate-100">
        <!-- JS로 입력 내용 동적 채움 -->
      </div>

      <button type="button" onclick="closeModal()"
        class="w-full py-3 bg-navy-800 text-white font-bold text-sm rounded-xl hover:bg-navy-900 transition-colors">
        확인
      </button>
    </div>
  </div>

  <script>
    // 💡 발급받으신 구글 앱스 스크립트 웹 앱 URL 반영 완료
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQ9WHo4DZT8UVtauOYwo3y9Gpi39p8idQFuywmp-AChM_BvHXDAW_Rqj7itYTJ11NH/exec';

    // Phone format (010-0000-0000)
    function formatPhoneNumber(input) {
      let value = input.value.replace(/[^0-9]/g, '');
      if (value.length > 3 && value.length <= 7) {
        value = value.slice(0, 3) + '-' + value.slice(3);
      } else if (value.length > 7) {
        value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
      }
      input.value = value;
    }

    // Address Copy
    function copyAddress() {
      const address = "경기도 양주시 은현면 화합로 1094번길 232";
      navigator.clipboard.writeText(address).then(() => {
        alert("주소가 클립보드에 복사되었습니다.");
      });
    }

    // Toggle All Terms
    function toggleAllTerms(mainCheckbox) {
      const checkboxes = document.querySelectorAll('.term-check');
      checkboxes.forEach(cb => cb.checked = mainCheckbox.checked);
    }

    // Form Submission & Data Sending
    async function handleFormSubmit(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      const formData = {
        name: document.getElementById('name').value,
        birth: document.getElementById('birth').value,
        gender: document.querySelector('input[name="gender"]:checked')?.value || '',
        phone: document.getElementById('phone').value,
        church: document.getElementById('church').value,
        denominations: document.getElementById('denominations').value,
        position: document.getElementById('position').value
      };

      // Loading UI State
      btn.disabled = true;
      btnText.textContent = "신청서 전송 중...";
      btnSpinner.classList.remove('hidden');

      try {
        if (GOOGLE_SCRIPT_URL) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
        }
      } catch (err) {
        console.error("전송 오류:", err);
      } finally {
        // Reset UI State
        btn.disabled = false;
        btnText.textContent = "캠프 참가 신청하기";
        btnSpinner.classList.add('hidden');
      }

      // Show Summary Content
      const summaryHTML = `
        <div class="flex justify-between"><span class="text-slate-400">이름:</span><span class="font-semibold">${formData.name}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">생년월일:</span><span>${formData.birth}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">성별:</span><span>${formData.gender}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">연락처:</span><span>${formData.phone}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">소속교회:</span><span>${formData.church}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">교단/직분:</span><span>${formData.denominations} / ${formData.position}</span></div>
      `;
      document.getElementById('summaryContent').innerHTML = summaryHTML;

      // Show Modal with Animation
      const modal = document.getElementById('completeModal');
      const container = document.getElementById('modalContainer');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        container.classList.remove('scale-95');
        container.classList.add('scale-100');
      }, 10);
    }

    // Close Modal & Reset Form
    function closeModal() {
      const modal = document.getElementById('completeModal');
      const container = document.getElementById('modalContainer');
      modal.classList.add('opacity-0');
      container.classList.remove('scale-100');
      container.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('campRegistrationForm').reset();
        document.getElementById('checkAll').checked = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 300);
    }
  </script>
</body>
</html>
